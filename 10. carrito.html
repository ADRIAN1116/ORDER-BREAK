<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi pedido - OrderBreak</title>
    <link rel="stylesheet" href="decoracion.css">
</head>
<body>
    <div class="barra-superior"> ☕ BIENVENIDO A ORDERBREAK </div>

    <header>
        <div class="logo">ORDER <span>BREAK</span></div>
        <nav class="navegacion">
            <a href="5.inicio.html">Inicio</a>
            <a href="7.productos.html">Menú</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html" class="boton-pedido">Mi pedido</a>
        </nav>
    </header>

    <section class="hero">
        <div class="pedido-box">
            <h2>Mi pedido</h2>
            <div id="lista-carrito"></div>
            <p id="total-carrito"></p>
            <button onclick="location.href='7.productos.html'">Seguir comprando</button>
            <button onclick="limpiarCarrito()">Vaciar carrito</button>
        </div>
    </section>

    <script>
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const lista = document.getElementById('lista-carrito');
        const total = document.getElementById('total-carrito');

        if (carrito.length === 0) {
            lista.innerHTML = '<p>No tienes productos agregados.</p>';
            total.textContent = 'Total: $0';
        } else {
            let totalPrecio = 0;
            lista.innerHTML = carrito.map(item => {
                totalPrecio += Number(item.precio);
                return `<p>${item.nombre} - $${item.precio.toLocaleString('es-CL')}</p>`;
            }).join('');
            total.textContent = `Total: $${totalPrecio.toLocaleString('es-CL')}`;
        }

        function limpiarCarrito() {
            localStorage.removeItem('carrito');
            window.location.reload();
        }
    </script>
</body>
</html>

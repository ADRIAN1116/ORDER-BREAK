<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ORDER Break</title>

    <link rel="stylesheet" href="decoracion.css">
</head>

<body>

    <div class="barra-superior">
        ☕ BIENVENIDO
    </div>

    <header>
        <div class="logo">
            ORDERBREAK
        </div>
    </header>

    <section class="hero">

        <div class="contenido">
            <h1>Regístrate en ORDER Break</h1>

            <p>
                Crea tu cuenta para realizar pedidos de forma rápida.
            </p>
        </div>

        <div class="pedido-box">

            <h2>Registro de Usuario</h2>

            <input type="text" id="nombre" placeholder="Nombre completo">

            <input type="email" id="correo" placeholder="Correo electrónico">

            <input type="text" id="usuario" placeholder="Nombre de usuario">

            <input type="password" id="password" placeholder="Contraseña">

            <input type="password" id="confirmarPassword" placeholder="Confirmar contraseña">

            <button id="btnRegistro" onclick="window.location.href='3.login.html'">
                Registrarse
            </button>

            <p>
                ¿Ya tienes cuenta?
                <a href="3.login.html">Iniciar sesión</a>
            </p>

        </div>

    </section>

    <script src="2.registro.js"></script>

</body>

</html>
